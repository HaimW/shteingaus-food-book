<html><head><meta content="text/html; charset=UTF-8" http-equiv="content-type"><style type="text/css">.c0{direction:rtl;text-align:right}.c1{font-weight:400;font-size:11pt}.c2{font-weight:700}.c3{font-size:14pt;font-weight:700;text-decoration:underline}.c4{font-weight:400}</style></head><body class="doc-content"><p class="c0" dir="rtl"><span class="c3">שניצל של אמא</span></p><p class="c0" dir="rtl"><span class="c1">ארוחה: ערב, צהריים</span></p><p class="c0" dir="rtl"><span class="c1">סוג: עיקרית</span><br><span class="c1">מאת: אמא</span></p><p class="c0" dir="rtl"><span class="c1">המתכון הכי אהוב בבית.</span></p><p class="c0" dir="rtl"><span style="display:inline-block;width:400px;height:300px"><img src="images/image1.jpg" alt=""></span></p><p class="c0" dir="rtl"><span class="c2">מצרכים:</span></p><p class="c0" dir="rtl"><span class="c1">1 ק&quot;ג חזה עוף</span><br><span class="c1">- 2 ביצים</span><br><span class="c1">• פירורי לחם</span><br></p><p class="c0" dir="rtl"><span class="c2">לציפוי</span></p><p class="c0" dir="rtl"><span class="c1">שומשום</span></p><p class="c0" dir="rtl"><span class="c1"></span></p><p class="c0" dir="rtl"><span class="c2">אופן </span><span class="c2">ההכנה</span></p><p class="c0" dir="rtl"><span class="c1">1. פורסים את החזה לפרוסות דקות.</span></p><p class="c0" dir="rtl"><span class="c1">2. טובלים בביצה ואז בפירורים</span><img src="images/image2.png" alt=""></p><p class="c0" dir="rtl"><span class="c1">3. מטגנים בשמן עמוק. </span><span class="c2">זהירות</span><span class="c4">: השמן חם *מאוד*</span></p><h3 class="c0" dir="rtl"><span class="c1">הגשה</span></h3><p class="c0" dir="rtl"><span class="c1">מגישים עם לימון.</span></p></body></html>
